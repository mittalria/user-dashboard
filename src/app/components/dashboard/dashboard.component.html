<div class="dashboard">
  <h2>User Dashboard</h2>

  <!-- Error State -->
  <div *ngIf="hasError" class="error">
    Something went wrong. Please try again.
  </div>

  <!-- Empty State -->
  <div *ngIf="!hasError && filteredUsers.length === 0">No users found.</div>

  <!-- Table — now uses filteredUsers, not the Observable directly -->
  <app-user-table
    *ngIf="filteredUsers.length > 0"
    [users]="filteredUsers"
    (searchChanged)="onSearchChanged($event)"
  >
  </app-user-table>
</div>
